<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#10081f">
    <title>Daymark — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#351354,#0e0916 55%);color:#f9f6ff;font:16px system-ui;text-align:center}.card{max-width:350px;padding:34px 28px;border:1px solid #ffffff16;border-radius:26px;background:#1c1229cc}img{width:72px;height:72px;border-radius:20px}h1{margin:22px 0 10px;font-size:32px;letter-spacing:-.04em}p{margin:0;color:#aaa0ba;line-height:1.55}button{margin-top:24px;min-height:50px;padding:0 22px;border:0;border-radius:15px;background:#a855f7;color:white;font:700 16px system-ui}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="">
      <h1>You’re offline.</h1>
      <p>Your private check-ins need a connection. Nothing has been changed.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
